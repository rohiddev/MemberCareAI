name: MemberCareAI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate MemberCareAI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: "ci-validation-project"
      GOOGLE_CLOUD_LOCATION: "us-central1"
      KNOWLEDGE_BACKEND: "vertex"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize dependencies
        run: uv sync --frozen

      - name: Compile Python files
        run: uv run python -m compileall -q membercare_app membercare_mcp scripts

      - name: Build package
        run: uv build

      - name: Show build artifacts
        run: ls -lh dist
